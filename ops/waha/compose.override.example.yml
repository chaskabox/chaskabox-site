# REFERENCE ONLY — do not apply without passing preflight and backing up
# /home/ubuntu/waha/docker-compose.yml, .env and existing session directory.
# Safe additive values: existing ports, volumes, credentials and engine settings
# remain those configured in the original Docker Compose file.
services:
  waha:
    image: devlikeapro/waha:arm
    platform: linux/arm64
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
