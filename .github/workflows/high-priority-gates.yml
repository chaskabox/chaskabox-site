name: ChaskaBox high-priority isolation checks
on:
  push:
    branches: ['improve/site-recheck-20261015']
    paths:
      - '.github/workflows/high-priority-gates.yml'
      - 'tools/recovery-drill.mjs'
      - 'tools/release-live-hash.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-asset-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node tools/release-live-hash.mjs
  offline-backup-and-migration-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_BACKUP_READ_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_READ_TOKEN }}
      STEP3_MIGRATION_PREFLIGHT: 'true'
    steps:
      - name: Prepare private temporary archive directory
        run: echo "BACKUP_DIR=$RUNNER_TEMP/chaskabox-database-backup" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate production backup destination and private credentials
        run: node tools/database-backup.mjs preflight
      - name: Install signed PostgreSQL 17 client
        run: bash tools/install-pg17-client.sh
      - name: Create complete private database plus media archive
        run: node tools/database-backup.mjs dump
      - name: Upload to private R2 and verify checksum readback
        run: node tools/database-backup.mjs upload
      - name: Offline restore, Auth recovery, and rolled-back Step 3 rehearsal
        run: node tools/recovery-drill.mjs
      - name: Remove sensitive runner files
        if: always()
        run: node tools/database-backup.mjs cleanup
