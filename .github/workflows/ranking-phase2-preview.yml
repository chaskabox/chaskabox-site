name: Ranking Phase 2 discovery preview
on:
  push:
    branches: ['improve/ranking-phase2-discovery-20261019']
permissions:
  contents: read
jobs:
  discovery-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check SSR texts, nonempty categories and unchanged homepage on preview
        env:
          PHASE2_RANKING_PREVIEW_URL: https://improve-ranking-phase2-discov.chaskabox-site.pages.dev
        run: node tools/ranking-phase2-preview-smoke.mjs
      - name: Archive non-sensitive screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ranking-phase2-preview-evidence
          path: test-results/ranking-phase2/
          retention-days: 7
