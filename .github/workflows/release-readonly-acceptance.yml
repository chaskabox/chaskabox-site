name: Final release read-only production and preview acceptance
on:
  push:
    branches: ['audit/phase3-postrelease-readonly-20261019']
permissions:
  contents: read
jobs:
  read-only-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Public pages only, block all non-read HTTP methods
        run: node tools/release-live-readonly-check.mjs
      - name: Preserve redacted findings (no order/customer data)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-readonly-acceptance
          path: test-results/release-readonly/
          retention-days: 7
