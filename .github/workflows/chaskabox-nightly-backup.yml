name: ChaskaBox nightly database backup

on:
  schedule:
    - cron: '20 21 * * *' # 02:20 Asia/Karachi (UTC+5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaskabox-nightly-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_BACKUP_READ_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_READ_TOKEN }}
      BACKUP_DIR: ${{ runner.temp }}/chaskabox-database-backup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate backup configuration before installing or exporting
        run: node tools/database-backup.mjs preflight
      - name: Install PostgreSQL 17 client from signed PostgreSQL repository
        run: bash tools/install-pg17-client.sh
      - name: Create database archive with schema, data, grants and role metadata
        run: node tools/database-backup.mjs dump
      - name: Upload to private R2 and verify checksum readback
        run: node tools/database-backup.mjs upload
      - name: Record failure visibly
        if: failure()
        run: |
          echo '::error::Database backup failed. No successful recovery is certified. Check the failed step and secure backup configuration.'
          echo 'Database backup failed. Check the failed step; a fresh usable backup is not confirmed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove plaintext backup files from runner
        if: always()
        run: node tools/database-backup.mjs cleanup
