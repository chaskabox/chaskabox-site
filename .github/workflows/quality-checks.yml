name: ChaskaBox quality checks
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REQUIRE_NATIVE_RECOVERY: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate workflow expressions and structure
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes='' .github/workflows/*.yml
      - run: bash tools/install-pg17-client.sh server
      - run: npm run check
      - name: Inventory every static page, form, script and admin navigation target
        run: node tools/a-z-surface-audit.mjs
      - run: npm test
      - run: npm run build:functions
      - run: npm run build:notifications
      - run: npm run build:media
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Actual source browser and accessibility acceptance with synthetic data
        run: npm run test:browser
      - name: Save synthetic browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: consolidated-browser-acceptance
          path: test-results/browser/
          retention-days: 7
          compression-level: 0
      - name: Install pinned live audit tool
        if: github.ref == 'refs/heads/main'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund lighthouse@12.8.2
      - name: Audit the deployed checked source on mobile
        if: github.ref == 'refs/heads/main'
        env:
          AUDIT_BASE_URL: https://chaskabox.online
        run: node tools/live-lighthouse-audit.mjs
      - name: Save read-only live mobile audit results
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: live-mobile-audit
          path: test-results/live-mobile/
          retention-days: 7
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan complete history and current source with a checksum-pinned scanner
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts='--all'
          mkdir "$RUNNER_TEMP/chaskabox-source-scan"
          git archive HEAD | tar --no-same-owner -x -C "$RUNNER_TEMP/chaskabox-source-scan"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/chaskabox-source-scan" --redact --no-banner
