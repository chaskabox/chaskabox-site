name: ChaskaBox isolated archive recovery
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_backup:
        description: Create a fresh private backup before restoring (leave enabled for routine drills)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'improve/final-closeout-20261014' || github.head_ref == 'improve/product-evidence-20261014' || github.head_ref == 'fix/phase12-owner-operations-backend-20261015' || github.head_ref == 'fix/production-acceptance-20261020' || github.head_ref == 'fix/retain-first-paint-20261020' || github.head_ref == 'fix/pending-final-20261020'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_BACKUP_READ_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_READ_TOKEN }}
      AGENT_MIGRATION_PREFLIGHT: ${{ github.head_ref == 'improve/product-evidence-20261014' && 'true' || 'false' }}
      PHASE12_MIGRATION_PREFLIGHT: ${{ github.head_ref == 'fix/phase12-owner-operations-backend-20261015' && 'true' || 'false' }}
    steps:
      - name: Set private backup directory
        run: echo "BACKUP_DIR=$RUNNER_TEMP/chaskabox-database-backup" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Validate private backup configuration
        run: node tools/database-backup.mjs preflight
      - name: Install PostgreSQL 17 client
        run: bash tools/install-pg17-client.sh
      - name: Create and read back a fresh database and media backup
        if: (github.event_name == 'workflow_dispatch' && inputs.fresh_backup) || (github.event_name == 'pull_request' && (github.head_ref == 'fix/production-acceptance-20261020' || github.head_ref == 'fix/retain-first-paint-20261020' || github.head_ref == 'fix/pending-final-20261020'))
        run: |
          node tools/database-backup.mjs dump
          node tools/database-backup.mjs upload
      - name: Restore a completed private archive and test offline Auth
        run: node tools/recovery-drill.mjs
      - name: Remove plaintext backup files
        if: always()
        run: node tools/database-backup.mjs cleanup
