name: SEO public live validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/seo-live-audit.mjs'
      - '.github/workflows/seo-live-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit production and SEO preview without deploying
        env:
          PREVIEW_BASE_URL: https://c0bc801a.chaskabox-site.pages.dev
          CHECK_PAGESPEED: '1'
        run: node tools/seo-live-audit.mjs
      - name: Lighthouse mobile homepage (lab)
        continue-on-error: true
        run: |
          npx --yes lighthouse@12.8.2 https://chaskabox.online/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,seo --output=json --output-path=seo-audit/lighthouse-home-mobile.json --quiet
      - name: Lighthouse mobile live product (lab)
        continue-on-error: true
        run: |
          npx --yes lighthouse@12.8.2 https://chaskabox.online/product/5/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,seo --output=json --output-path=seo-audit/lighthouse-product-mobile.json --quiet
      - name: Show available Lighthouse results
        if: always()
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for(const p of ['seo-audit/lighthouse-home-mobile.json','seo-audit/lighthouse-product-mobile.json']){if(!fs.existsSync(p)){console.log(p,'unavailable');continue;}const x=JSON.parse(fs.readFileSync(p));console.log(JSON.stringify({file:p,url:x.finalDisplayedUrl,performance:x.categories?.performance?.score,seo:x.categories?.seo?.score,labLCP:x.audits?.['largest-contentful-paint']?.numericValue,labCLS:x.audits?.['cumulative-layout-shift']?.numericValue,labTBT:x.audits?.['total-blocking-time']?.numericValue}));}"
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaskabox-seo-live-validation
          path: seo-audit/
          if-no-files-found: warn
          retention-days: 14
