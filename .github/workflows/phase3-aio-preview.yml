name: Phase 3 AIO GEO AEO preview
on:
  push:
    branches: ['release/phase3-trust-verified-20261019']
permissions:
  contents: read
jobs:
  aio-source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check public AI guide, FAQ, breadcrumbs and llms sources on Pages preview
        env:
          PHASE3_PREVIEW_URL: https://release-phase3-trust-verifie.chaskabox-site.pages.dev
        run: node tools/phase3-aio-preview-smoke.mjs
      - name: Store browser and source evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: phase3-aio-browser-evidence
          path: test-results/phase3-aio/
          retention-days: 7
