name: Ranking Phase 1 SEO staging preview
on:
  push:
    branches: ['improve/ranking-phase1-audit-20261019']
permissions:
  contents: read
jobs:
  ranking-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Validate metadata and preserved shopping experience
        env:
          RANKING_PREVIEW_URL: https://improve-ranking-phase1-audit.chaskabox-site.pages.dev
        run: node tools/ranking-phase1-preview-smoke.mjs
      - name: Preserve review screenshots and test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ranking-phase1-browser-evidence
          path: test-results/ranking-phase1/
          retention-days: 7
